<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ghanim Juma</title>
    <meta name="color-scheme" content="light dark">
    <!-- Posters are the video's first frame: they paint instantly while the video buffers. -->
    <link rel="preload" as="image" href="assets/videos/gj-hero-mobile-poster.jpg" media="(orientation: portrait)" fetchpriority="high">
    <link rel="preload" as="image" href="assets/videos/gj-hero-web-poster.jpg" media="(orientation: landscape)" fetchpriority="high">
    <style>
        :root {
            --bg: #ffffff;
            --brand-brown: #4b2f2a;
            --brand-cream: #f4f1e8;
            --video-fallback: var(--brand-brown);
            /* Light tint over the video so the cream text stays readable on bright scenes. Set to 0 to remove. */
            --scrim-opacity: 0.45;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0b0c;
            }
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        /* On html only: a body background would paint over the z-index:-1 video layer. */
        html {
            background: var(--bg);
        }
        .bg-video {
            position: fixed;
            inset: 0;
            /* Fill the real visible area on mobile browsers whose toolbars show/hide. */
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            z-index: -1;
            overflow: hidden;
            background: var(--video-fallback) url("assets/videos/gj-hero-web-poster.jpg") center / cover no-repeat;
        }
        @media (orientation: portrait) {
            .bg-video {
                background-image: url("assets/videos/gj-hero-mobile-poster.jpg");
            }
        }
        .bg-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            pointer-events: none;
        }
        .bg-video::after {
            content: "";
            position: absolute;
            inset: 0;
            background: #1e120f;
            opacity: var(--scrim-opacity);
        }

        /* ---- Overlay: three equal columns split by two thin lines, content in the middle one ---- */
        .stage {
            position: fixed;
            inset: 0;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        .stage__col {
            grid-column: 2;
            position: relative;
            border-inline: 1px solid color-mix(in srgb, var(--brand-cream) 75%, transparent);
        }
        .stage__logo,
        .stage__tagline {
            position: absolute;
            inset-inline-start: 17%;
            margin: 0;
        }
        /* Widths are capped by viewport height too, so on short screens the logo
           and tagline shrink instead of running into each other. */
        .stage__logo {
            top: 27.5%;
            width: min(40%, 30vh);
        }
        .stage__tagline {
            top: 69.5%;
            width: min(55%, 40vh);
        }
        .stage img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Portrait screens (phones, tablets, narrow windows): thirds would be too tight,
           so the middle column takes most of the width and the content keeps the
           desktop proportions, with room on the right so the tagline never touches the line. */
        @media (orientation: portrait) {
            .stage {
                grid-template-columns: 1fr 10fr 1fr;
            }
            .stage__logo,
            .stage__tagline {
                inset-inline-start: 13%;
            }
            .stage__logo {
                top: 28%;
                width: min(44%, 300px);
            }
            .stage__tagline {
                top: 68%;
                width: min(62%, 420px);
            }
        }
    </style>
</head>
<body>
    <div class="bg-video" aria-hidden="true">
        <!--
            The browser plays the first source it supports whose media query matches:
            - Portrait screens (phones) get the dedicated 9:16 mobile cut at 720x1280.
              HEVC first (hardware-decoded on iPhone/Android = smooth, battery-friendly), then AV1.
            - Landscape: AV1 (Chrome/Edge/Firefox) then HEVC (Safari).
            - H.264 is the universal fallback for both.
        -->
        <video
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            disablepictureinpicture
            disableremoteplayback
        >
            <source src="assets/videos/gj-hero-mobile-hevc.mp4" type='video/mp4; codecs="hvc1"' media="(orientation: portrait)">
            <source src="assets/videos/gj-hero-mobile-av1.mp4" type='video/mp4; codecs="av01.0.05M.10"' media="(orientation: portrait)">
            <source src="assets/videos/gj-hero-mobile-h264.mp4" type="video/mp4" media="(orientation: portrait)">
            <source src="assets/videos/gj-hero-web-av1.mp4" type='video/mp4; codecs="av01.0.08M.10"'>
            <source src="assets/videos/gj-hero-web-hevc.mp4" type='video/mp4; codecs="hvc1"'>
            <source src="assets/videos/gj-hero-web-h264.mp4" type="video/mp4">
        </video>
    </div>

    <main class="stage">
        <div class="stage__col">
            <h1 class="stage__logo">
                <img src="assets/images/GJ-Soon-02.svg" width="255" height="207" alt="Ghanim Juma — غانم جمعة" fetchpriority="high">
            </h1>
            <p class="stage__tagline">
                <img src="assets/images/GJ-Soon-03.svg" width="356" height="86" alt="New doors, new horizons — أبواب جديدة، آفاق جديدة">
            </p>
        </div>
    </main>

    <script>
        (function () {
            var video = document.querySelector('.bg-video video');
            if (!video) return;

            // Respect users who ask for less motion: keep the still poster.
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            function applyMotionPreference() {
                if (reduceMotion.matches) {
                    video.pause();
                } else {
                    var p = video.play();
                    if (p && p.catch) p.catch(function () {});
                }
            }
            applyMotionPreference();
            if (reduceMotion.addEventListener) {
                reduceMotion.addEventListener('change', applyMotionPreference);
            }

            // Don't decode frames while the tab is hidden.
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) video.pause();
                else applyMotionPreference();
            });
        })();
    </script>
</body>
</html>
